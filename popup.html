<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT Exporter — Multiplatform</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-platform="chatgpt">
  <div class="glass-bg"></div>
  
  <div class="app-container">
    <header>
      <div class="logo-area">
        <div id="platform-icon" class="platform-orb"></div>
        <div class="title-stack">
          <h1 id="platform-name">ChatGPT</h1>
          <span class="version">Explorer v1.2</span>
        </div>
      </div>
      <div class="status-pill">
        <span class="pulse"></span>
        <span id="status-badge" class="badge">Ready</span>
      </div>
    </header>

    <!-- SETUP SCREEN -->
    <div id="screen-setup" class="screen active">

      <div class="subtitle">Select Scope</div>
      <div class="section scope-container">
        <div class="tabs">
          <button class="scope-tab active" data-scope="all">Full History</button>
          <button class="scope-tab" data-scope="projects_only">Projects</button>
          <button class="scope-tab" data-scope="project">Selected Project</button>
          <button class="scope-tab" data-scope="custom">Select Individual</button>
        </div>
        
        <div id="project-picker" class="picker-panel" style="display:none;">
          <div class="picker-row">
            <select id="project-select">
              <option value="">Discovering chats...</option>
            </select>
            <button id="btn-refresh-projects" title="Refresh sidebar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
          </div>
        </div>

        <div id="selective-picker" class="picker-panel" style="display:none;">
           <div class="list-container" id="selective-list" style="max-height:160px; overflow-y:auto; border:1px solid rgba(255,255,255,0.05); border-radius:10px; padding:4px;">
              <small style="opacity:0.3; padding:10px; display:block;">Discovering conversations...</small>
           </div>
        </div>
      </div>

      <div class="subtitle">Export Format</div>
      <div class="section format-grid" style="display:flex; flex-direction:column; gap:8px;">
        <label class="radio-card">
          <input type="radio" name="format" value="json" checked>
          <div class="card-content">
             <b>JSON</b> &middot; Raw data for developers
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="format" value="md">
          <div class="card-content">
             <b>MARKDOWN</b> &middot; Perfect for Obsidian / Notion
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="format" value="html">
          <div class="card-content">
             <b>HTML</b> &middot; Self-contained styled archive
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="format" value="csv">
          <div class="card-content">
             <b>SPREADSHEET (CSV)</b> &middot; Row/column table format
          </div>
        </label>
      </div>

      <div class="section options">
        <label class="toggle">
          <input type="checkbox" id="opt-assets" checked>
          <span class="slider"></span>
          <span class="label-text">Download Attachments / Images</span>
        </label>
      </div>

      <div class="footer">
        <button id="btn-export" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Everything
        </button>
        <button id="btn-insights" class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          Open Dashboard
        </button>
      </div>
      
      <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 0; border-top:1px solid rgba(255,255,255,0.05); margin-top:10px;">
        <a id="github-link" href="https://github.com/Paranjayy/chatgpt-exporter" target="_blank" style="text-decoration:none; color:rgba(255,255,255,0.3); font-size:10px; display:flex; align-items:center; gap:4px; transition:all 0.2s;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          Paranjayy / chatgpt-exporter
        </a>
      </div>
      <p class="notice">⚠️ Anthropic & Google sidebar scraper active.</p>
    </div>

    <!-- PROGRESS SCREEN -->
    <div id="screen-progress" class="screen">
      <div class="progress-ring-container">
        <svg class="progress-ring" width="120" height="120">
          <circle class="ring-track" cx="60" cy="60" r="54" />
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="54" />
        </svg>
        <div id="ring-pct" class="ring-text">0%</div>
      </div>
      
      <h2 id="phase-label">Initializing...</h2>
      
      <div class="stats-grid">
        <div class="stat">
          <small>Total Chats</small>
          <b id="stat-total">...</b>
        </div>
        <div class="stat">
          <small>Processed</small>
          <b id="stat-fetched">0</b>
        </div>
        <div class="stat">
          <small>Files Saved</small>
          <b id="stat-dl">0</b>
        </div>
      </div>

      <div id="stat-current" style="margin-top:16px; font-size:12px; color:#10a37f; text-align:center; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px;">
        Initializing...
      </div>

      <button id="btn-cancel" style="margin-top:16px; width:100%; height:40px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:#e55353; font-weight:700; cursor:pointer;">
        Stop Export
      </button>

      <div class="log-container">
        <div id="log-box" class="log-content"></div>
      </div>
    </div>

    <!-- DONE SCREEN -->
    <div id="screen-done" class="screen">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Export Complete!</h2>
      <p id="done-meta">... conversations &middot; 0.0s</p>
      
      <div id="done-errors" class="error-log" style="display:none;"></div>
      
      <div class="footer" style="display:flex; flex-direction:column; gap:10px;">
        <button id="btn-restart" class="hub-btn-primary">New Harvest</button>
        <button id="btn-discard" class="secondary-btn" style="opacity:0.6; font-size:11px;">Discard & Reset Session</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
